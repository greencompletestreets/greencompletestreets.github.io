  <!-- Self-contained minimal CSS so the home hero can't override anything -->
  <style>
    :root { --brand:#4acaa8; --muted:#777; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:#fff; color:#222; font:16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; }
    a { color:#136f63; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.site { border-bottom:1px solid #eee; }
    .wrap { max-width:1100px; margin:0 auto; padding:1.25rem 1rem; }
    .brand { display:flex; align-items:center; gap:.75rem; }
    .brand img { width:44px; height:44px; object-fit:cover; border-radius:6px; }
    nav a { margin-right:1rem; }
    nav a.active { color:var(--brand); font-weight:600; }

    h1,h2,h3 { line-height:1.2; margin:0 0 .3em; }
    .page-subtitle { margin:.2em 0 0; color:#777; }

    .filters { display:flex; gap:.75rem; align-items:center; margin:1rem 0 2rem; flex-wrap:wrap; }
    .filters input[type="search"] { border:2px solid #e4e4e4; border-radius:6px; padding:.55em .75em; min-width:18rem; }
    .chip { border:2px solid #e4e4e4; border-radius:999px; padding:.3em .8em; cursor:pointer; user-select:none; background:#fff; }
    .chip.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .muted { color:#aaa; font-style:italic; }
    .tag { font-size:.85em; border:1px solid #e4e4e4; border-radius:5px; padding:.05em .4em; margin-left:.35em; color:#777; }

    details.resource-group { border-top:6px solid #f4f4f4; padding-top:1rem; margin-top:.25rem; }
    details.resource-group summary { font-weight:700; font-size:1.15rem; cursor:pointer; list-style:none; }
    details.resource-group[open] summary { color:var(--brand); }

    .table-wrapper { margin-top: 1rem; overflow-x:auto; }
    table { width:100%; border-collapse: collapse; }
    thead th { text-align:left; font-weight:700; font-size:.95rem; border-bottom:2px solid #eee; padding:.6rem .5rem; }
    tbody td { border-bottom:1px solid #f1f1f1; padding:.6rem .5rem; vertical-align: top; }
    td.url a { word-break: break-word; }
    .sr-only { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

    footer.site { border-top:1px solid #eee; margin-top:2rem; color:var(--muted); }
    @media (max-width: 736px) {
      .filters input[type="search"]{ min-width:12rem; flex:1; }
      .wrap { padding:1rem .8rem; }
      thead th:nth-child(2), tbody td:nth-child(2) { min-width:10rem; }
      thead th:nth-child(5), tbody td:nth-child(5) { min-width:12rem; }
    }
  </style>
</head>
