<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to Rapid Delivery | Green Complete Streets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- "Quick Build" is the commonly used industry term, so this path is
       kept as a permanent redirect for anyone who types or links it
       directly. The canonical page -- used for all internal navigation,
       canonical metadata, and search indexing -- is /toolkit/rapid-delivery/.
       Plain GitHub Pages has no server-side rewrite/redirect config, so
       this combines an instant meta-refresh + JS redirect (functionally a
       301) with a self-referencing-elsewhere canonical tag, which is the
       standard static-hosting equivalent. -->
  <link rel="canonical" href="https://www.greencompletestreets.com/toolkit/rapid-delivery/" />
  <meta http-equiv="refresh" content="0; url=../rapid-delivery/" />
  <script>location.replace("../rapid-delivery/");</script>
</head>
<body>
  <p>This page has moved to <a href="../rapid-delivery/">Rapid Delivery: Interim Treatments</a>.</p>
</body>
</html>
